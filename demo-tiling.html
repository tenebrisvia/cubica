<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubica demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            margin: 0;
            font-size: 0.875rem;
            color: #cbd5e1;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas width="800" height="800"></canvas>
        <div id="ui">
            <h2>Cubica demo</h2>
            <p id="status">Initializing WebGPU...</p>
            <p id="fps">FPS: 0</p>
            <p id="samples">Samples: 0</p>
        </div>
    </div>
    <script type="module" src="demo-tiling.js"></script>
</body>
</html>
